# ===== StoreMate - konfigurasi Spring Boot =====
spring.application.name=StoreMate

# Koneksi database (sesuaikan bila user/password MySQL berbeda)
spring.datasource.url=jdbc:mysql://localhost:3306/storemate?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Jakarta&useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=

# JPA / Hibernate: tabel sudah dibuat lewat storemate.sql, jadi jangan diubah otomatis
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Aplikasi desktop, bukan web
spring.main.web-application-type=none
